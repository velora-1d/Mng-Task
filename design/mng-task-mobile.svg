<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <!-- Premium Soft Natural Shadows (WCAG & Antislop compliant) -->
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1C1917" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#1C1917" flood-opacity="0.02" />
    </filter>
    
    <filter id="hero-shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C2410C" flood-opacity="0.05" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1C1917" flood-opacity="0.03" />
    </filter>

    <filter id="fab-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#C2410C" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#9A3412" flood-opacity="0.18" />
    </filter>

    <filter id="dock-shadow" x="-5%" y="-15%" width="110%" height="130%">
      <feDropShadow dx="0" dy="-4" stdDeviation="6" flood-color="#1C1917" flood-opacity="0.03" />
    </filter>

    <clipPath id="device-screen">
      <rect width="390" height="844" rx="44" />
    </clipPath>
  </defs>

  <!-- Screen Frame -->
  <g clip-path="url(#device-screen)">
    <!-- Base Canvas: Warm Cream #FAFAF9 (Ember Studio tokens) -->
    <rect width="390" height="844" fill="#FAFAF9" />

    <!-- ============================================================ -->
    <!-- 1. STATUS BAR & NOTCH (iOS Safe Area 44px) -->
    <!-- ============================================================ -->
    <g id="status-bar">
      <!-- Dynamic Island Capsule (Apple Standard 124x34) -->
      <rect x="133" y="11" width="124" height="32" rx="16" fill="#1C1917" />
      <!-- Camera Lens & Sensor -->
      <circle cx="238" cy="27" r="5.5" fill="#292524" />
      <circle cx="152" cy="27" r="4" fill="#44403C" />

      <!-- Time Indicator (Inter / SF Pro, Clean Sans) -->
      <text x="34" y="32" font-family="Inter" font-size="14" font-weight="600" fill="#1C1917">09:41</text>

      <!-- Connection & Battery Vector Icons -->
      <g transform="translate(322, 21)" fill="#1C1917">
        <!-- Signal Bars -->
        <rect x="0" y="7" width="3" height="5" rx="1" />
        <rect x="5" y="5" width="3" height="7" rx="1" />
        <rect x="10" y="2.5" width="3" height="9.5" rx="1" />
        <rect x="15" y="0" width="3" height="12" rx="1" />
        <!-- Battery Outer -->
        <rect x="23" y="0.5" width="22" height="11" rx="3.5" fill="none" stroke="#1C1917" stroke-width="1.3" />
        <!-- Battery Juice -->
        <rect x="25" y="2.5" width="14" height="7" rx="1.8" fill="#16A34A" />
        <!-- Terminal Nib -->
        <path d="M 46 3.5 L 46 8.5" stroke="#1C1917" stroke-width="1.3" stroke-linecap="round" />
      </g>
    </g>

    <!-- ============================================================ -->
    <!-- 2. APP TOP BAR & WORKSPACE -->
    <!-- ============================================================ -->
    <g id="topbar" transform="translate(20, 54)">
      <!-- Avatar with initials PH -->
      <circle cx="20" cy="20" r="20" fill="#E7E5E4" stroke="#D6D3D1" stroke-width="1" />
      <text x="20" y="25" text-anchor="middle" font-family="Inter" font-size="13" font-weight="700" fill="#57534E">PH</text>

      <!-- Workspace & Screen Title -->
      <g transform="translate(50, 2)">
        <text x="0" y="14" font-family="Inter" font-size="11" font-weight="700" fill="#78716C" letter-spacing="0.06em">MNG-TASK · EMBER STUDIO</text>
        <text x="0" y="34" font-family="Playfair Display" font-size="20" font-weight="700" fill="#1C1917">Halo, Pak Hakim</text>
      </g>

      <!-- Notification Bell Button (40x40 Touch Friendly) -->
      <g transform="translate(310, 0)">
        <rect width="40" height="40" rx="12" fill="#F5F5F4" stroke="#E7E5E4" stroke-width="1" />
        <path d="M 20 12 C 16.8 12 14.5 14.5 14.5 18 L 14.5 22.5 C 14.5 24.5 13 25.5 13 25.5 L 27 25.5 C 27 25.5 25.5 24.5 25.5 22.5 L 25.5 18 C 25.5 14.5 23.2 12 20 12 Z" fill="none" stroke="#1C1917" stroke-width="1.6" stroke-linejoin="round" />
        <path d="M 18.5 28 C 18.8 28.8 19.3 29.2 20 29.2 C 20.7 29.2 21.2 28.8 21.5 28" stroke="#1C1917" stroke-width="1.6" stroke-linecap="round" />
        <!-- Amber Status Dot -->
        <circle cx="26" cy="13" r="4.5" fill="#F59E0B" stroke="#FAFAF9" stroke-width="1.5" />
      </g>
    </g>

    <!-- ============================================================ -->
    <!-- 3. SEARCH BAR -->
    <!-- ============================================================ -->
    <g id="search-bar" transform="translate(20, 110)">
      <rect width="350" height="42" rx="10" fill="#F5F5F4" stroke="#D6D3D1" stroke-width="1" />
      <!-- Search Icon -->
      <g transform="translate(14, 13)" stroke="#78716C" stroke-width="1.8" fill="none">
        <circle cx="6.5" cy="6.5" r="5" />
        <line x1="10.5" y1="10.5" x2="15" y2="15" stroke-linecap="round" />
      </g>
      <text x="40" y="26" font-family="Inter" font-size="13" fill="#78716C">Cari task, tiket, atau label sprint...</text>
    </g>

    <!-- ============================================================ -->
    <!-- 4. HORIZONTAL FILTER CHIPS -->
    <!-- ============================================================ -->
    <g id="filter-chips" transform="translate(20, 162)">
      <!-- Chip 1: Semua (Active Primary Terracotta) -->
      <g>
        <rect width="84" height="32" rx="16" fill="#C2410C" />
        <text x="42" y="20.5" text-anchor="middle" font-family="Inter" font-size="12" font-weight="600" fill="#FAFAF9">Semua (54)</text>
      </g>
      <!-- Chip 2: In Progress -->
      <g transform="translate(90, 0)">
        <rect width="108" height="32" rx="16" fill="#F5F5F4" stroke="#D6D3D1" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#C2410C" />
        <text x="60" y="20.5" text-anchor="middle" font-family="Inter" font-size="12" font-weight="500" fill="#57534E">In Progress (3)</text>
      </g>
      <!-- Chip 3: To Do -->
      <g transform="translate(204, 0)">
        <rect width="78" height="32" rx="16" fill="#F5F5F4" stroke="#D6D3D1" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#78716C" />
        <text x="47" y="20.5" text-anchor="middle" font-family="Inter" font-size="12" font-weight="500" fill="#57534E">To Do (6)</text>
      </g>
      <!-- Chip 4: Selesai -->
      <g transform="translate(288, 0)">
        <rect width="62" height="32" rx="16" fill="#F5F5F4" stroke="#D6D3D1" stroke-width="1" />
        <circle cx="14" cy="16" r="3.5" fill="#16A34A" />
        <text x="36" y="20.5" text-anchor="middle" font-family="Inter" font-size="12" font-weight="500" fill="#57534E">Done</text>
      </g>
    </g>

    <!-- ============================================================ -->
    <!-- 5. HERO SPRINT PROGRESS CARD -->
    <!-- ============================================================ -->
    <g id="sprint-card" transform="translate(20, 206)" filter="url(#hero-shadow)">
      <rect width="350" height="116" rx="14" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1" />
      
      <!-- Top Row: Badge & Deadline -->
      <g transform="translate(18, 16)">
        <rect width="82" height="20" rx="6" fill="#FFF7ED" stroke="#FDBA74" stroke-width="0.8" />
        <text x="41" y="14" text-anchor="middle" font-family="Inter" font-size="10" font-weight="700" fill="#C2410C">SPRINT MVP · P0</text>
        <text x="314" y="14" text-anchor="end" font-family="Inter" font-size="11" font-weight="600" fill="#78716C">Sisa 12 Hari</text>
      </g>

      <!-- Sprint Title & Description -->
      <text x="18" y="58" font-family="Playfair Display" font-size="17" font-weight="700" fill="#1C1917">Fondasi, Auth &amp; Task Engine</text>
      <text x="18" y="75" font-family="Inter" font-size="12" font-weight="400" fill="#57534E">24 dari 54 task selesai dikerjakan</text>

      <!-- Progress Track & Fill -->
      <g transform="translate(18, 88)">
        <rect width="260" height="6" rx="3" fill="#E7E5E4" />
        <rect width="115" height="6" rx="3" fill="#C2410C" />
        <!-- Percentage Label -->
        <text x="314" y="8" text-anchor="end" font-family="Inter" font-size="13" font-weight="700" fill="#C2410C">44%</text>
      </g>
    </g>

    <!-- ============================================================ -->
    <!-- 6. SECTION HEADER -->
    <!-- ============================================================ -->
    <g id="section-header" transform="translate(20, 342)">
      <text x="0" y="16" font-family="Playfair Display" font-size="18" font-weight="700" fill="#1C1917">Task Prioritas</text>
      <text x="350" y="15" text-anchor="end" font-family="Inter" font-size="12" font-weight="600" fill="#C2410C">Lihat Semua (54) →</text>
    </g>

    <!-- ============================================================ -->
    <!-- 7. CLEAN TASK CARDS (NO CLUTTER, HUMAN-DESIGNED) -->
    <!-- ============================================================ -->
    <g id="task-list" transform="translate(20, 368)">

      <!-- CARD 1: IN PROGRESS (F-05) - Terracotta Active Accent -->
      <g id="task-f05" filter="url(#card-shadow)">
        <rect width="350" height="96" rx="12" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.2" />
        <!-- 3px Left Accent -->
        <rect width="3.5" height="96" rx="1.75" fill="#C2410C" />

        <!-- Checkbox Indicator (Circular In-Progress Dot) -->
        <g transform="translate(16, 20)">
          <circle cx="9" cy="9" r="8" fill="none" stroke="#C2410C" stroke-width="1.8" />
          <circle cx="9" cy="9" r="4" fill="#C2410C" />
        </g>

        <!-- Task Code & Title -->
        <text x="42" y="28" font-family="Inter" font-size="14" font-weight="700" fill="#1C1917">F-05 App shell &amp; drawer mobile 360px</text>
        <text x="42" y="46" font-family="Inter" font-size="12" fill="#57534E">Responsif SvelteKit layout sesuai preview.html</text>

        <!-- Card Meta Row: Module, Due Date, Assignee, Progress -->
        <g transform="translate(42, 68)">
          <!-- Tag: Module -->
          <rect width="58" height="18" rx="4" fill="#F5F5F4" stroke="#E7E5E4" stroke-width="0.8" />
          <text x="29" y="12.5" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#78716C">#Fondasi</text>

          <!-- Due Date -->
          <text x="70" y="13" font-family="Inter" font-size="11" font-weight="500" fill="#78716C">Hari ini, 18:00</text>

          <!-- Assignee Avatar -->
          <circle cx="215" cy="9" r="9" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1" />
          <text x="215" y="12.5" text-anchor="middle" font-family="Inter" font-size="9" font-weight="700" fill="#C2410C">PH</text>

          <!-- Progress Badge -->
          <rect x="238" y="0" width="54" height="18" rx="9" fill="#FFF7ED" />
          <text x="265" y="13" text-anchor="middle" font-family="Inter" font-size="10" font-weight="700" fill="#C2410C">75%</text>
        </g>
      </g>

      <!-- CARD 2: TO DO (A-02) -->
      <g id="task-a02" transform="translate(0, 108)" filter="url(#card-shadow)">
        <rect width="350" height="96" rx="12" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1" />
        <!-- Neutral Left Accent -->
        <rect width="3.5" height="96" rx="1.75" fill="#A8A29E" />

        <!-- Checkbox Indicator (Empty Circle) -->
        <circle cx="25" cy="29" r="8" fill="none" stroke="#A8A29E" stroke-width="1.8" />

        <!-- Task Code & Title -->
        <text x="42" y="28" font-family="Inter" font-size="14" font-weight="700" fill="#1C1917">A-02 Form login &amp; session cookie</text>
        <text x="42" y="46" font-family="Inter" font-size="12" fill="#57534E">Hash Argon2id, cookie flags httpOnly/Secure/Lax</text>

        <!-- Meta Row -->
        <g transform="translate(42, 68)">
          <rect width="44" height="18" rx="4" fill="#F5F5F4" stroke="#E7E5E4" stroke-width="0.8" />
          <text x="22" y="12.5" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#78716C">#Auth</text>

          <text x="56" y="13" font-family="Inter" font-size="11" font-weight="500" fill="#78716C">Besok, 12:00</text>

          <rect x="150" y="0" width="70" height="18" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="0.8" />
          <text x="185" y="12.5" text-anchor="middle" font-family="Inter" font-size="9" font-weight="700" fill="#B45309">PRIORITAS P1</text>

          <rect x="238" y="0" width="54" height="18" rx="9" fill="#F5F5F4" />
          <text x="265" y="13" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#78716C">To Do</text>
        </g>
      </g>

      <!-- CARD 3: COMPLETED (F-03) -->
      <g id="task-f03" transform="translate(0, 216)" filter="url(#card-shadow)">
        <rect width="350" height="88" rx="12" fill="#F5F5F4" stroke="#E7E5E4" stroke-width="1" />
        <!-- Green Accent -->
        <rect width="3.5" height="88" rx="1.75" fill="#16A34A" />

        <!-- Checkbox (Checked Circle with Checkmark) -->
        <circle cx="25" cy="27" r="8" fill="#16A34A" />
        <path d="M 21 27 L 24 30 L 29 23" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Title Muted Strikethrough -->
        <text x="42" y="27" font-family="Inter" font-size="14" font-weight="600" fill="#78716C" text-decoration="line-through">F-03 Schema Drizzle 8 tabel &amp; libSQL</text>
        <text x="42" y="45" font-family="Inter" font-size="12" fill="#A8A29E">Migrasi data/mngtask.db selesai &amp; diverifikasi</text>

        <!-- Meta Row -->
        <g transform="translate(42, 60)">
          <text x="0" y="12" font-family="Inter" font-size="11" font-weight="600" fill="#16A34A">✓ Selesai 31 Okt 13:45</text>
        </g>
      </g>

    </g>

    <!-- ============================================================ -->
    <!-- 8. FLOATING ACTION BUTTON (+ Task) -->
    <!-- ============================================================ -->
    <g id="fab" transform="translate(310, 694)" filter="url(#fab-shadow)">
      <circle cx="28" cy="28" r="28" fill="#C2410C" />
      <line x1="28" y1="18" x2="28" y2="38" stroke="#FAFAF9" stroke-width="2.6" stroke-linecap="round" />
      <line x1="18" y1="28" x2="38" y2="28" stroke="#FAFAF9" stroke-width="2.6" stroke-linecap="round" />
    </g>

    <!-- ============================================================ -->
    <!-- 9. BOTTOM NAVIGATION DOCK (Touch Target 48px, Safe Area 34px) -->
    <!-- ============================================================ -->
    <g id="dock" transform="translate(0, 764)" filter="url(#dock-shadow)">
      <rect width="390" height="80" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1" />

      <!-- Tab 1: Tasks (Active) -->
      <g transform="translate(40, 10)">
        <rect x="0" y="-10" width="30" height="3" rx="1.5" fill="#C2410C" />
        <!-- Tasks Vector Icon -->
        <rect x="4" y="2" width="22" height="22" rx="6" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.6" />
        <path d="M 10 13 L 13 16 L 20 9" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="15" y="36" text-anchor="middle" font-family="Inter" font-size="11" font-weight="700" fill="#C2410C">Task</text>
      </g>

      <!-- Tab 2: Board -->
      <g transform="translate(136, 10)">
        <rect x="4" y="3" width="9" height="18" rx="2.5" fill="none" stroke="#78716C" stroke-width="1.6" />
        <rect x="17" y="3" width="9" height="12" rx="2.5" fill="none" stroke="#78716C" stroke-width="1.6" />
        <text x="15" y="36" text-anchor="middle" font-family="Inter" font-size="11" font-weight="500" fill="#78716C">Board</text>
      </g>

      <!-- Tab 3: Jadwal -->
      <g transform="translate(230, 10)">
        <rect x="4" y="3" width="20" height="18" rx="3.5" fill="none" stroke="#78716C" stroke-width="1.6" />
        <line x1="4" y1="8.5" x2="24" y2="8.5" stroke="#78716C" stroke-width="1.4" />
        <circle cx="9" cy="13.5" r="1.3" fill="#78716C" />
        <circle cx="14" cy="13.5" r="1.3" fill="#78716C" />
        <circle cx="19" cy="13.5" r="1.3" fill="#78716C" />
        <text x="14" y="36" text-anchor="middle" font-family="Inter" font-size="11" font-weight="500" fill="#78716C">Jadwal</text>
      </g>

      <!-- Tab 4: Profil -->
      <g transform="translate(320, 10)">
        <circle cx="14" cy="12" r="7" fill="none" stroke="#78716C" stroke-width="1.6" />
        <path d="M 14 3 L 14 5.5 M 14 18.5 L 14 21 M 5 12 L 7.5 12 M 20.5 12 L 23 12" stroke="#78716C" stroke-width="1.6" stroke-linecap="round" />
        <text x="14" y="36" text-anchor="middle" font-family="Inter" font-size="11" font-weight="500" fill="#78716C">Profil</text>
      </g>

      <!-- Home Drag Bar -->
      <rect x="125" y="66" width="140" height="4.5" rx="2.25" fill="#1C1917" opacity="0.3" />
    </g>

  </g>
</svg>
